# Formaldehyde (H2CO) — example generalized input file
# Run with: python run_from_config.py configs/example_formaldehyde.yaml

name: formaldehyde
coordinate_mode: internal

elements: [C, O, H, H]

geometry:
  smiles: C=O

symmetry: C2v

isotopologues:
  - name: H2-12C-16O
    masses: [12.00000000000, 15.99491461956, 1.00782503207, 1.00782503207]
    components: [A, B, C]
    obs_b0_mhz: [281970.0, 38834.0, 34105.0]
    alpha_mhz: [18000.0, 1200.0, 1100.0]
    sigma_mhz: [2.0, 0.2, 0.2]

  - name: H2-13C-16O
    masses: [13.00335483507, 15.99491461956, 1.00782503207, 1.00782503207]
    components: [A, B, C]
    obs_b0_mhz: [273030.0, 37117.0, 32686.0]
    alpha_mhz: [17500.0, 1150.0, 1050.0]
    sigma_mhz: [2.0, 0.2, 0.2]

quantum:
  backend: none

preset: BALANCED
rng_seed: 17
write_xyz: false

internal_coordinates:
  use_dihedrals: false
  damping: 1.0e-6
  microiterations: 20
  prior_weight: 1.0
  prior_sigma_bond: 0.04
  prior_sigma_angle_deg: 2.0
  prior_sigma_dihedral_deg: 15.0

internal_priors:
  mode: soft
  freeze_sigma_floor: 1.0e-6
  adaptive:
    identifiability_gamma: 2.0
    min_sigma_scale: 0.5
    max_sigma_scale: 3.0
  user_priors: []

torsion_hamiltonian:
  enabled: false
  F: 5.0
  rho: 0.1
  n_basis: 7
  n_levels: 8
  J_values: [0, 1]
  K_values: [0]
  units: cm-1
  potential:
    v0: 0.0
    vcos: {3: -20.0}
    vsin: {}

output:
  root: runs
  artifacts: true
