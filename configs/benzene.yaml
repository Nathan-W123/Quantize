# Benzene (C6H6) — Quantize input file
# Run with: python runner/run_from_config.py configs/benzene.yaml
#
# ── Notes & References ─────────────────────────────────────────────────────────
#
# Molecular symmetry: D6h (oblate symmetric top, A = B by symmetry).
#   Only B and C are independent; A is constrained equal to B via D6h symmetry.
#
# Rotational constants (B0):
#   C6H6   B0 = 5689.2855(54) MHz
#   C6D6   B0 = 4707.3175(34) MHz
#   13C6H6 B0 = 5337.884(51)  MHz
#   Source: Horsch, P. et al., RSC Advances 12 (2022) 23714–23722.
#           doi:10.1039/D2RA03431J
#           GPS-stabilised rotational Raman spectroscopy; uncertainties are
#           1-sigma in the last digits quoted.
#
# C0 values:
#   Derived from the planar relation Ic = Ia + Ib.  For D6h benzene Ia = Ib,
#   so Ic = 2*Ib, giving C0 = B0 / 2 exactly.  No independent measurement
#   of C0 is available for the symmetric isotopologues (only B is directly
#   observed in the Raman experiment); this relation is an exact consequence
#   of planarity.
#   C6H6:   C0 = 2844.643 MHz
#   C6D6:   C0 = 2353.659 MHz
#   13C6H6: C0 = 2668.942 MHz
#
# Be correction approach:
#   The optimizer uses delta_total = delta_vib + delta_elec + delta_BOB,
#   computed automatically from ORCA's VPT2 output (run_rovib) and stored
#   internally as delta_total_constants.  The alpha_mhz field below is only
#   a legacy fallback used when delta_total is unavailable (e.g. ORCA absent
#   or rovib fails).  When running with ORCA as configured here, alpha_mhz
#   is not used.  Values are set to 0.0 as a safe no-op fallback.
#   For reference: Be − B0 ≈ 8–10 MHz for benzene (≈0.15% of B0).
#   Pliva, J. & Johns, J. W. C., Can. J. Phys. 61 (1983) 269.
#
# Accepted molecular geometry:
#   All bond angles are exactly 120° and all C–C bonds are equal by D6h symmetry.
#
#   Ground-state average structure (r0), from rotational Raman isotopologue fit:
#     r0(C–C) = 1.3938(11) Å
#     r0(C–H) = 1.1059(12) Å   ← vibrationally inflated; not the equilibrium length
#   Source: Horsch et al., RSC Advances 12 (2022) 23714. doi:10.1039/D2RA03431J
#
#   Equilibrium structure (re), Watson r_2m mass-dependent method, same source:
#     re(C–C) = 1.3913(2) Å
#     re(C–H) = 1.0814(3) Å
#
#   Most precise semi-experimental equilibrium (re^SE), 11 isotopologues,
#   CCSD(T)/cc-pCVTZ vibration-rotation + electron-mass corrections:
#     re(C–C) = 1.3914 Å  (sub-mÅ precision)
#     re(C–H) = 1.0802 Å
#   Source: Esselman et al., J. Am. Chem. Soc. 145 (2023) 21785–21797.
#           doi:10.1021/jacs.3c03109
#
#   Note: the r0 C–H value (1.106 Å) is significantly longer than re (1.080 Å)
#   due to zero-point vibrational averaging — this is normal for light H atoms.
#   The optimizer fits to Be (equilibrium), so it converges toward re, not r0.
#
# Masses — CODATA 2018 atomic masses:
#   12C = 12.00000000 amu (by definition)
#   13C = 13.00335483507 amu
#    1H =  1.00782503207 amu
#    2H =  2.01410177785 amu
#   Source: Meija, J. et al., Pure Appl. Chem. 88 (2016) 265–291.
#           doi:10.1515/pac-2015-0305
# ───────────────────────────────────────────────────────────────────────────────

name: benzene

# Atom order: C1–C6 then H1–H6 (para pairs adjacent in numbering)
elements: [C, C, C, C, C, C, H, H, H, H, H, H]

geometry:
  smiles: c1ccccc1          # aromatic SMILES; PubChem returns MMFF94-relaxed geometry

symmetry: D6h

isotopologues:
  - name: C6H6
    masses: [12.00000000000, 12.00000000000, 12.00000000000,
             12.00000000000, 12.00000000000, 12.00000000000,
              1.00782503207,  1.00782503207,  1.00782503207,
              1.00782503207,  1.00782503207,  1.00782503207]
    components: [B, C]
    obs_b0_mhz: [5689.2855, 2844.643]   # B0 measured; C0 = B0/2 (planar + D6h)
    alpha_mhz:  [0.0, 0.0]              # alpha corrections unavailable — see notes
    sigma_mhz:  [0.005, 0.010]          # B: from quoted ±0.0054 MHz; C: 2× B sigma

  - name: C6D6
    masses: [12.00000000000, 12.00000000000, 12.00000000000,
             12.00000000000, 12.00000000000, 12.00000000000,
              2.01410177785,  2.01410177785,  2.01410177785,
              2.01410177785,  2.01410177785,  2.01410177785]
    components: [B, C]
    obs_b0_mhz: [4707.3175, 2353.659]   # B0 measured; C0 = B0/2
    alpha_mhz:  [0.0, 0.0]
    sigma_mhz:  [0.003, 0.006]          # B: from quoted ±0.0034 MHz; C: 2× B sigma

  - name: 13C6H6
    masses: [13.00335483507, 13.00335483507, 13.00335483507,
             13.00335483507, 13.00335483507, 13.00335483507,
              1.00782503207,  1.00782503207,  1.00782503207,
              1.00782503207,  1.00782503207,  1.00782503207]
    components: [B, C]
    obs_b0_mhz: [5337.884, 2668.942]    # B0 measured; C0 = B0/2
    alpha_mhz:  [0.0, 0.0]
    sigma_mhz:  [0.05, 0.10]            # B: from quoted ±0.051 MHz; C: 2× B sigma

quantum:
  backend:    orca
  method:     wB97X-D4
  basis:      def2-TZVPP
  executable: null

preset:    BALANCED
rng_seed:  7
write_xyz: true

coordinate_mode: internal
internal_coordinates:
  use_dihedrals: false
  damping: 1.0e-6
  microiterations: 20
  prior_weight: 1.0
  prior_sigma_bond: 0.02          # tighter than default — benzene bonds well-defined
  prior_sigma_angle_deg: 1.0      # tighter — D6h constrains all angles to 120°
  prior_sigma_dihedral_deg: 15.0

internal_priors:
  mode: soft
  freeze_sigma_floor: 1.0e-6
  adaptive:
    identifiability_gamma: 2.0
    min_sigma_scale: 0.5
    max_sigma_scale: 3.0
  user_priors: []

torsion_hamiltonian:
  enabled: false                  # benzene has no internal rotor
  F: 5.0
  rho: 0.0
  n_basis: 7
  n_levels: 8
  J_values: [0, 1]
  K_values: [0]
  units: cm-1
  potential:
    v0: 0.0
    vcos: {3: -10.0}
    vsin: {}

output:
  root: output/runs
  artifacts: true
