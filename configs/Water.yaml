# Quantize — generalized molecular input file
# Usage:  python run_from_config.py configs/your_molecule.yaml
#
# Required fields: name, elements, geometry, isotopologues
# Everything else has sensible defaults.

# ── Job identifier ─────────────────────────────────────────────────────────────
name: water                         # used in output and optional XYZ filename

# ── Atom list ─────────────────────────────────────────────────────────────────
# List element symbols in the atom order you will use throughout this file.
# All masses, coordinates, and isotopologue entries must follow this same order.
elements: [O, H, H]

# ── Initial geometry ───────────────────────────────────────────────────────────
# The optimizer refines whatever starting geometry you provide, so precision here
# only affects convergence speed — but the starting point must be in the right
# ballpark (correct bond order, roughly correct lengths).
#
# Recommended: supply a SMILES string (requires internet).
# SMILES encodes bond order, so PubChem returns an MMFF94-relaxed geometry with
# correct bond lengths automatically — no manual input needed.
geometry:
  smiles: O                        # water SMILES

# Offline alternative — specify bond connectivity and approximate lengths.
# Use bond_lengths for any molecule with double or triple bonds; omitting it
# defaults to single-bond covalent radii which will be wrong for multiple bonds.
# geometry:
#   method: bonds
#   bonds: [[0, 1], [0, 2]]        # 0-based atom index pairs
#   bond_lengths: [1.01, 1.01]     # starting estimates (Å), one per bond — optional

# Explicit Cartesian coordinates (Angstrom) — most precise starting point.
# geometry:
#   method: coords
#   coords_angstrom:               # one [x, y, z] row per atom, same order as elements
#     - [ 0.0000,  0.0000,  0.1174]   # O
#     - [ 0.0000,  0.7572, -0.4696]   # H
#     - [ 0.0000, -0.7572, -0.4696]   # H

# ── Point-group symmetry (optional) ───────────────────────────────────────────
# Constrains the optimization to the symmetric subspace.
# Benefits: enforces equivalent bonds (e.g. equal O-H lengths in C2v water),
#           reduces effective DOF, improves convergence for symmetric molecules.
# Set to null to run without symmetry constraints.
# Common values: C2v, Cs, C3v, Cinf_v, D2h, D6h, auto (infer from geometry)
# C2v applies to H2-16O and H2-18O, but HDO breaks C2v — r(O-H) and r(O-D)
# become independently constrained only when symmetry is released.
symmetry: C2v

# ── Spectral data ─────────────────────────────────────────────────────────────
# One block per isotopologue.  At least one is required; more isotopologues give
# a better-constrained geometry.
#
# masses       — atomic masses in amu, in the same atom order as `elements`.
# components   — which rotational constants are observed: any subset of [A, B, C].
#                Asymmetric tops: [A, B, C].  Linear molecules: [B] only.
# obs_b0_mhz   — observed ground-state rotational constants B0 (MHz), Watson A/B/C order.
# alpha_mhz    — optional; omitted here because rovibrational_corrections.harmonic_from_hessian
#                computes α from the ORCA Hessian each run (Be = B0 + 0.5·α internally).
# sigma_mhz    — experimental 1σ uncertainties (MHz) from the same source as B0.
#
# Spectroscopic sources (ground vibrational state):
#   NIST Triatomic Spectral Database — H2O tables
#   https://physics.nist.gov/PhysRefData/MolSpec/Triatomic/Html/Tables/H2O.html
#   H2^16O: A0, B0, C0 — NIST ref. keyword 74005 (MARVEL / Towle–Bailly compilation).
#   H2^18O: A0, B0, C0 — NIST ref. keyword 74005 (same table; experimental values).
#   See also W2020 / W2024 water isotopologue databases (J. Phys. Chem. Ref. Data / Sci. Data).

isotopologues:
  - name: H2-16O
    masses:     [15.99491461956, 1.00782503207, 1.00782503207]
    components: [A, B, C]
    obs_b0_mhz: [835840.288, 435351.717, 278138.700]
    sigma_mhz:  [1000.0, 900.0, 900.0]
    # NIST CD (MHz); enable fit_cd_constants + cd_weight to use in optimization:
    # cd_observed: {DJ: 37.59422, DJK: -172.9128, DK: 973.29052, delta_J: 15.210402, delta_K: 41.0502}
    # cd_sigma:    {DJ: 0.05, DJK: 0.34, DK: 0.19, delta_J: 0.02, delta_K: 0.30}

  - name: H2-18O
    masses:     [17.99915961286, 1.00782503207, 1.00782503207]
    components: [A, B, C]
    obs_b0_mhz: [825366.08, 435331.59, 276950.46]
    sigma_mhz:  [8.7, 8.0, 8.0]

  
# ── Rovibrational corrections ─────────────────────────────────────────────────
# electronic_correction: Gordy-Cook δ_elec = -(m_e / M_total) × B0
#   For water (M ≈ 18 amu) the correction on A is ~−25 MHz.
#   10% uncertainty reflects the Gordy-Cook approximation (ignoring g-tensor).
#
# harmonic_from_hessian: compute Σ_r α_r^K for each isotopologue from the
#   Cartesian Hessian (already computed by ORCA for the geometry prior).
#   Includes both centrifugal (∂²B/∂Q²) and Coriolis (ζ_{rs}^K) contributions.
#   This is self-consistent with the DFT geometry and avoids the planar-defect
#   problem that arises from using literature alpha values at a different level.
rovibrational_corrections:
  electronic_correction: true
  sigma_elec_fraction: 0.10
  # Harmonic alpha is computed automatically from the ORCA Hessian each run.
  # sigma_fraction=0.02 assigns 2% uncertainty to the harmonic correction,
  # reflecting the typical deviation between harmonic and VPT2 alpha values.
  harmonic_from_hessian: true
  harmonic_sigma_fraction: 0.02
  # Harmonic CD from Hessian (Watson A-reduction τ′); optional soft fit vs experiment:
  harmonic_cd_from_hessian: true
  cd_sigma_fraction: 0.05
  fit_cd_constants: false
  cd_weight: 0.0

# ── Quantum chemistry ──────────────────────────────────────────────────────────
# backend:    orca | psi4 | none
#             Use "none" for spectral-only mode (no quantum prior; geometry may be
#             underdetermined if spectral data alone does not fully constrain it).
# method:     any method string recognized by the backend (e.g. wB97X-D4, B3LYP,
#             CCSD(T), MP2).
# basis:      any basis set string recognized by the backend (e.g. def2-TZVPP,
#             def2-SVP, cc-pVTZ).
# executable: full path to the ORCA binary, or null to search PATH automatically.
#             On Windows you may need: executable: C:/orca/orca.exe
quantum:
  backend:    orca
  method:     wB97X-D4
  basis:      def2-TZVPP
  executable: null

# ── Run control ────────────────────────────────────────────────────────────────
# preset:    controls n_starts, convergence thresholds, and weighting policy.
#            FAST_DEBUG  — 1 start, loose convergence.  Good for quick testing.
#            BALANCED    — 3 starts, moderate convergence.  Good default.
#            STRICT      — 5 starts, tight convergence.  Best accuracy.
# rng_seed:  integer seed for multi-start jitter reproducibility.
# write_xyz: if true, write the best optimized geometry to <name>_optimized.xyz.
preset:    BALANCED
rng_seed:  42
write_xyz: false

# Use internal-coordinate optimization by default.
coordinate_mode: internal
internal_coordinates:
  use_dihedrals: false
  damping: 1.0e-6
  microiterations: 20
  prior_weight: 1.0
  prior_sigma_bond: 0.04
  prior_sigma_angle_deg: 2.0
  prior_sigma_dihedral_deg: 15.0

# Optional torsion Hamiltonian block (Phase 2/3/4).
# Water is not a torsional rotor, so this is disabled by default.
torsion_hamiltonian:
  enabled: false
  F: 5.0
  rho: 0.1
  n_basis: 7
  n_levels: 8
  J_values: [0, 1]
  K_values: [0]
  units: cm-1
  potential:
    v0: 20.0
    vcos: {3: -20.0}      # V3 barrier: vcos3 = -V3/2 in this convention
    vsin: {}
  # Optional Phase-3 objective targets:
  # use_in_selection: true
  # selection_weight: 0.01
  # targets:
  #   - {J: 0, K: 0, level_index: 0, energy_cm-1: 12.34}
