# Acetaldehyde (CH3CHO) — rigid spectral model, underconstrained demo
# For the full torsional LAM pipeline see example_acetaldehyde_lam.yaml
#
# Rotational constants: ground torsional state, JPL catalog entry 44003
# (data from Kleiner, Lovas & Godefroid, J. Phys. Chem. Ref. Data 25, 1113
# (1996)). The catalog gives rho-axis constants A = 56507.198, B = 10454.077,
# C = 9089.087 MHz, to be diagonalised with Dab = -3677.76 MHz; the principal-
# axis values below are that diagonalisation (axes 4.54 deg apart):
#     A = 56799.051 MHz   B = 10162.224 MHz   C = 9089.087 MHz
# Inertial defect -3.03 amu A^2 (the catalog's separate E-state fit, entry
# 44005, gives -3.17). The values this file used before (A 52842.4,
# B 10240.6, C 8648.0) match neither entry and give -0.48, which the
# engine's inertial-defect check flags: fitted at HF/6-31G they left 74 MHz
# RMS and a distorted structure (C=O 1.248 A, CCO 116 deg), against 1.1 MHz
# and C=O 1.218 A, CCO 123.5 deg with these.
# Torsion parameters:
#   Kleiner, Lovas & Godefroid, J. Phys. Chem. Ref. Data 25, 1113 (1996),
#   Table I (global rho-axis-method fit of the v_t = 0, 1, 2 states), cm^-1:
#     V3 = 407.94707   V6 = -12.91775   F = 7.655853   rho = 0.329088
#     A = 1.884874   B = 0.348716329   C = 0.303177697   Dab = -0.12270925
#   (A, B, C are rho-axis constants; the last digits of A are unreadable in
#   the scanned table; JPL catalog entry 44003 gives A 56507.198 MHz =
#   1.884877 cm^-1, B and C agree with the table to 0.2 MHz).
#
# Known reference geometry (for validation):
#   r(C=O)  ~ 1.210 A    r(C-C)  ~ 1.516 A
#   r(C-H)  ~ 1.114 A    ang(CCO) ~ 123.9 deg

name: acetaldehyde
coordinate_mode: cartesian

# Atom order follows SMILES CC=O:
#   0: C (methyl)   1: C (carbonyl)   2: O
#   3-5: H (methyl)   6: H (aldehyde)
elements: [C, C, O, H, H, H, H]

geometry:
  smiles: CC=O

symmetry: null

isotopologues:
  - name: 12CH3-12CHO
    masses: [12.00000000000, 12.00000000000, 15.99491461957,
             1.00782503207, 1.00782503207, 1.00782503207, 1.00782503207]
    components: [A, B, C]
    obs_b0_mhz: [56799.051, 10162.224, 9089.087]
    alpha_mhz: [0.0, 0.0, 0.0]
    sigma_mhz: [5.0, 0.1, 0.1]

quantum:
  backend: orca
  method: wB97X-D4
  basis: def2-TZVPP
  executable: null

preset: BALANCED
rng_seed: 37
write_xyz: false

internal_coordinates:
  use_dihedrals: true
  damping: 1.0e-6
  microiterations: 20
  # prior_weight: unset -- no rule-library prior while the quantum prior
  # is on. Set a weight to use it, with the widths below.
  prior_sigma_bond: 0.12
  prior_sigma_angle_deg: 5.0
  prior_sigma_dihedral_deg: 20.0

internal_priors:
  mode: soft
  freeze_sigma_floor: 1.0e-6
  adaptive:
    identifiability_gamma: 2.0
    min_sigma_scale: 0.5
    max_sigma_scale: 3.0
  user_priors: []

# Torsion parameters from Kleiner, Lovas & Godefroid 1996 (Table I) --
# disabled for this rigid demo. V(alpha) = V3/2 (1 - cos 3a) + V6/2 (1 - cos 6a):
#   v0 = (V3 + V6)/2 = 197.51466, vcos3 = -V3/2 = -203.973535, vcos6 = -V6/2 = 6.458875
# Enable (and set spectral_model: internal_rotor_bc) for the full LAM pipeline;
# configs/example_acetaldehyde_lam.yaml has it set up.
torsion_hamiltonian:
  enabled: false
  F: 7.655853
  rho: 0.329088
  n_basis: 16
  n_levels: 8
  J_values: [0, 1, 2]
  K_values: [0, 1]
  units: cm-1
  potential:
    v0: 197.51466
    vcos: {3: -203.973535, 6: 6.458875}
    vsin: {}

output:
  root: output/runs
  artifacts: true
