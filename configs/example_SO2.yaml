# SO2 (sulfur dioxide) — example generalized input file
# Run with: python run_from_config.py configs/example_SO2.yaml

name: SO2
coordinate_mode: cartesian

elements: [S, O, O]

geometry:
  smiles: O=S=O

symmetry: C2v

isotopologues:
  # Literature values (Mueller & Brünken 2005 / JPL): A0 60778.516(16),
  # B0 10318.0747(24), C0 8799.3076(24); 34S: A0 58544.11(11).
  - name: 32S-16O2
    masses: [31.97207117440, 15.99491461956, 15.99491461956]
    components: [A, B, C]
    obs_b0_mhz: [60778.5160, 10318.0747, 8799.3076]
    alpha_mhz: [387.00, 70.96, 117.06]
    sigma_mhz: [0.016, 0.0024, 0.0024]

  - name: 34S-16O2
    masses: [33.96786700400, 15.99491461956, 15.99491461956]
    components: [A, B, C]
    obs_b0_mhz: [58544.1100, 10318.0800, 8767.1200]
    alpha_mhz: [368.80, 71.00, 113.56]
    sigma_mhz: [0.11, 0.01, 0.01]

quantum:
  backend: orca
  method: wB97X-D4
  basis: def2-TZVPP
  executable: null

preset: BALANCED
rng_seed: 13
write_xyz: false

internal_coordinates:
  use_dihedrals: false
  damping: 1.0e-6
  microiterations: 20
  prior_weight: 1.0
  prior_sigma_bond: 0.04
  prior_sigma_angle_deg: 2.0
  prior_sigma_dihedral_deg: 15.0

internal_priors:
  mode: soft
  freeze_sigma_floor: 1.0e-6
  adaptive:
    identifiability_gamma: 2.0
    min_sigma_scale: 0.5
    max_sigma_scale: 3.0
  user_priors: []

torsion_hamiltonian:
  enabled: false
  F: 5.0
  rho: 0.1
  n_basis: 7
  n_levels: 8
  J_values: [0, 1]
  K_values: [0]
  units: cm-1
  potential:
    v0: 0.0
    vcos: {3: -20.0}
    vsin: {}

output:
  root: output/runs
  artifacts: true
