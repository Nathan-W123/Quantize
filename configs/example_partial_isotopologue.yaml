# Methanol partial-isotopologue coverage example
# Run with: python run_from_config.py configs/example_partial_isotopologue.yaml

name: methanol_partial_isotopologue
coordinate_mode: internal
spectral_model: internal_rotor_bc

elements: [C, O, H, H, H, H]

geometry:
  smiles: CO

symmetry: null

# Demonstrates partial-coverage spectral inputs:
# - parent isotopologue has full A/B/C
# - secondary isotopologue includes only B/C (no A available)
isotopologues:
  - name: 12CH3-16OH_full
    masses: [12.0, 15.99491461957, 1.00782503207, 1.00782503207, 1.00782503207, 1.00782503207]
    components: [A, B, C]
    obs_b0_mhz: [127523.4, 24692.5, 23760.3]
    alpha_mhz: [0.0, 0.0, 0.0]
    sigma_mhz: [2.0, 0.05, 0.05]

  - name: 13CH3-16OH_partial
    masses: [13.00335483507, 15.99491461957, 1.00782503207, 1.00782503207, 1.00782503207, 1.00782503207]
    components: [B, C]
    obs_b0_mhz: [23747.3, 22865.9]
    alpha_mhz: [0.0, 0.0]
    sigma_mhz: [0.08, 0.08]

quantum:
  backend: none

preset: FAST_DEBUG
rng_seed: 23
write_xyz: false

internal_coordinates:
  use_dihedrals: true
  damping: 1.0e-6
  microiterations: 20
  prior_weight: 1.0
  prior_sigma_bond: 0.06
  prior_sigma_angle_deg: 4.0
  prior_sigma_dihedral_deg: 20.0

internal_priors:
  mode: adaptive
  freeze_sigma_floor: 1.0e-6
  adaptive:
    identifiability_gamma: 2.0
    min_sigma_scale: 0.5
    max_sigma_scale: 3.0
  user_priors: []

torsion_hamiltonian:
  enabled: false
  F: 5.0
  rho: 0.1
  n_basis: 7
  n_levels: 8
  J_values: [0, 1]
  K_values: [0]
  units: cm-1
  potential:
    v0: 0.0
    vcos: {3: -20.0}
    vsin: {}

output:
  root: runs
  artifacts: true
