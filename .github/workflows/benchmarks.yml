name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  benchmark-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run benchmark regression tests
        run: python -m pytest dev/tests/test_benchmark_suite.py dev/tests/test_conformer_benchmark_suite.py dev/tests/test_lam_benchmarks.py dev/tests/test_lam_acetaldehyde.py -q -m "not slow"

      - name: Run LAM benchmark suite with thresholds
        run: python cli.py benchmark lam --baseline dev/benchmarks/baselines/lam.json --output results/benchmarks/lam-latest.json --history-dir results/benchmarks/history --enforce-thresholds

      - name: Run conformer benchmark suite with thresholds
        run: python cli.py benchmark conformer --baseline dev/benchmarks/baselines/conformer.json --output results/benchmarks/conformer-latest.json --history-dir results/benchmarks/history --enforce-thresholds

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts-${{ github.run_number }}
          path: results/benchmarks/
          if-no-files-found: error
          retention-days: 90
